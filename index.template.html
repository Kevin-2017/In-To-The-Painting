<style>
/* One visual world: open air. The painting fills the screen; what little interface there is sits on it like light, thin and pale. */
:root {
  --dusk: #1f2238;                       /* violet shade under words and behind the album */
  --light: #fffaf0;                      /* lines and words on the painting */
  --sun: #ffc65c;                        /* the one accent: the sun on its arc, a moment caught */
  --mute: rgba(255, 250, 240, 0.72);
  --line: rgba(255, 250, 240, 0.45);
  --mat: #f7f3ea;                        /* the mount around a picture in the album */
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", Georgia, serif;
  --font-latin: "Cormorant Garamond", Georgia, "Noto Serif SC", serif;
  --font-meta: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--dusk); color: var(--light); font-family: var(--font-display); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
#app { position: relative; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#view.drag { cursor: grabbing; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }
.shade { text-shadow: 0 1px 2px rgba(31, 34, 56, 0.7), 0 0 16px rgba(31, 34, 56, 0.45); }
.fade { opacity: 0; visibility: hidden; transition: opacity 0.9s ease, visibility 0s linear 0.9s; }
.fade.on { opacity: 1; visibility: visible; transition: opacity 0.9s ease, visibility 0s; }

#loading { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: clamp(20px, 6vw, 72px); background: var(--dusk); font-family: var(--font-meta); font-size: 14px; letter-spacing: 0.3em; color: var(--mute); transition: opacity 1.2s ease; }
#loading.gone { opacity: 0; pointer-events: none; }

/* title: the name low on the left, the dawn behind it */
#title { display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(22px, 6vw, 76px); gap: 16px; background: linear-gradient(to top, rgba(31, 34, 56, 0.5), rgba(31, 34, 56, 0) 46%); }
#title h1 { margin: 0; font-weight: 900; font-size: clamp(52px, 10vw, 136px); line-height: 1.02; letter-spacing: 0.08em; }
#title h1.en { font-family: var(--font-latin); font-weight: 500; font-style: italic; letter-spacing: 0; font-size: clamp(42px, 7.6vw, 108px); text-wrap: balance; }
#title .sub { font-family: var(--font-meta); font-size: clamp(13px, 1.5vw, 16px); letter-spacing: 0.3em; opacity: 0.9; }
#title .goal { font-family: var(--font-meta); font-size: clamp(13.5px, 1.45vw, 16px); letter-spacing: 0.1em; line-height: 1.6; opacity: 0.86; max-width: 32em; margin-top: -4px; }
#title .acts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.plaque { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.24em; padding: 12px 26px 12px 28px; border: 1px solid var(--light); border-radius: 999px; background: rgba(31, 34, 56, 0.18); backdrop-filter: blur(3px); transition: background 0.25s, color 0.25s; }
.plaque:hover { background: var(--light); color: var(--dusk); text-shadow: none; }
.plaque.quiet { border-color: var(--line); color: var(--mute); }
#soundHint { position: absolute; right: clamp(16px, 6vw, 76px); bottom: clamp(24px, 6vw, 80px); display: flex; align-items: center; gap: 9px; padding: 8px 16px 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(31, 34, 56, 0.34); font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.2em; color: var(--light); pointer-events: none; z-index: 3; }
#soundHint svg { width: 17px; height: 17px; flex: none; fill: currentColor; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#soundHint.on { animation: sndcall 2.8s ease-in-out 0.9s infinite; }
#soundHint.play { right: auto; bottom: auto; left: clamp(14px, 3vw, 30px); top: clamp(48px, 3vw + 36px, 64px); }
@keyframes sndcall { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
.lang { position: absolute; top: clamp(14px, 4vw, 40px); right: clamp(16px, 6vw, 76px); font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.14em; padding: 8px 10px; color: var(--mute); }
.lang b { color: var(--light); font-weight: 500; }

/* in the world: two quiet words top right, the sun's road at the bottom */
#tools { position: absolute; top: clamp(10px, 3vw, 24px); right: clamp(12px, 3.4vw, 30px); display: flex; gap: 4px; }
#tools button { font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.2em; padding: 9px 12px; border-bottom: 1px solid transparent; opacity: 0.86; }
#tools button:hover, #tools button.active { border-bottom-color: var(--sun); opacity: 1; }
#tools .n { font-family: var(--font-latin); font-style: italic; font-size: 15px; letter-spacing: 0.02em; margin-left: 6px; font-variant-numeric: tabular-nums; display: inline-block; }
/* the interface comes in piece by piece, each piece when it first means something */
#tools button, #sundial, #seasons { transition: opacity 1.2s ease, width 0.9s ease, height 0.9s ease; }
.hide-seek #btnSeek, .hide-more #btnAlbum, .hide-more #btnHelp, .hide-dial #sundial { opacity: 0; pointer-events: none; }
#tools #btnSeek.call { color: var(--sun); border-bottom-color: var(--sun); opacity: 1; animation: seekcall 1.3s ease-in-out infinite; }
@keyframes seekcall { 0%, 100% { text-shadow: 0 0 0 rgba(255, 198, 92, 0); } 50% { text-shadow: 0 0 14px rgba(255, 198, 92, 0.95); } }
.hide-dots #seasons, .hide-dial #seasons { display: none; }
.coarse #tools button { padding: 12px 12px; }
#btnAlbum.bump .n { animation: bump 0.9s ease-out; }
@keyframes bump { 0% { transform: scale(1); color: var(--light); } 30% { transform: scale(2.1); color: var(--sun); } 100% { transform: scale(1); color: var(--light); } }
/* what was just caught, as a mounted print: it stands a moment, then goes into the album */
#print { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; background: var(--mat); border: 0 solid var(--mat); box-shadow: 0 14px 50px rgba(10, 12, 28, 0.6); transform-origin: 0 0; will-change: transform, opacity; }
#print img { display: block; width: 100%; height: 100%; }
.dab { position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 45% 55% 50% 40%; will-change: transform, opacity; }
#gain { position: absolute; top: clamp(48px, 3vw + 36px, 64px); right: clamp(18px, 3.4vw + 8px, 42px); display: flex; align-items: center; gap: 9px; font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.18em; pointer-events: none; }
#gain { gap: 6px; }
#gain .nm { margin-right: 5px; opacity: 0; transition: opacity 0.9s ease; }
#gain .ct { margin-right: 4px; font-family: var(--font-latin); font-style: italic; font-size: 15px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; opacity: 0.92; }
#gain.say .nm { opacity: 1; }
#gain i { width: 18px; height: 12px; border-radius: 1.5px; border: 1px solid rgba(255, 250, 240, 0.62); background: rgba(31, 34, 56, 0.3) center / cover no-repeat; opacity: 0.85; transition: opacity 0.9s ease, box-shadow 0.9s ease, border-color 0.9s ease; }
#gain i.on { border-color: var(--sun); opacity: 1; }
#gain.say i.on { box-shadow: 0 0 9px rgba(255, 198, 92, 0.75); }
#gain.all .nm { color: var(--sun); }
/* framing a view of her own: a round button at the right keeps it */
#shutter { position: absolute; right: clamp(18px, 4vw, 54px); top: 50%; width: 62px; height: 62px; margin-top: -31px; border-radius: 50%; border: 2px solid var(--light); background: rgba(31, 34, 56, 0.2); opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s linear 0.5s, transform 0.15s; }
#shutter::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--light); opacity: 0.92; }
#shutter:active { transform: scale(0.92); }
.framing #shutter { opacity: 1; visibility: visible; transition: opacity 0.5s ease, visibility 0s, transform 0.15s; }
.framing #btnFree { border-bottom-color: var(--sun); opacity: 1; }

/* the clock: the sun's road, and beside it the weather, the seasons or the years of this world as labels to press.
   Walking, it sits at the bottom. At an easel it goes into the band left free beside the picture: under it on a wide screen,
   under it with room to spare on an upright phone, to its right on a phone held sideways */
#clock { position: absolute; left: 50%; bottom: clamp(8px, 2.4vh, 22px); transform: translateX(-50%); display: flex; align-items: center; gap: 16px; transition: bottom 0.9s ease; }
#sundial { position: relative; flex: none; width: calc(264px * var(--dk, 1)); height: calc(78px * var(--dk, 1)); touch-action: none; }
#sundial::before { content: ""; position: absolute; inset: -14px -18px -10px; } /* a finger does not have to hit the line */
.easel #clock, .framing #clock { bottom: var(--cb, 3px); }
.easel #sundial, .framing #sundial { --dk: var(--ds, 1); }
#seasons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: var(--sw, 420px); }
.sz { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(31, 34, 56, 0.24); font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.1em; white-space: nowrap; opacity: 0.84; transition: background 0.3s, border-color 0.3s, opacity 0.3s; }
.sz i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(31, 34, 56, 0.35); }
.sz:hover { opacity: 1; border-color: var(--light); }
.sz.now { opacity: 1; border-color: var(--light); background: rgba(255, 250, 240, 0.2); }
.sz.todo::after { content: ""; position: absolute; top: -3px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 7px rgba(255, 198, 92, 0.85); }
.coarse .sz { padding: 10px 14px 10px 11px; font-size: 13.5px; }
/* on a touch screen the clock is a thing of the easel and of framing. On the walk it only shows the hour, and a thumb can pass over it */
.coarse:not(.easel):not(.framing) #clock { pointer-events: none; opacity: 0.8; }
.coarse:not(.easel):not(.framing) #clock > * { pointer-events: none; }
.coarse:not(.easel):not(.framing) #seasons { display: none; }
.coarse:not(.easel):not(.framing) #sundial { --dk: 0.72; }
.lay-tall #clock { flex-direction: column-reverse; gap: 10px; }
.lay-tall #seasons { max-width: calc(100vw - 24px); }
.lay-low.easel #clock, .lay-low.framing #clock { left: auto; right: calc(var(--bs, 180px) / 2); bottom: auto; top: 50%; transform: translate(50%, -50%); flex-direction: column; gap: 10px; }
.lay-low #seasons { max-width: calc(var(--bs, 180px) - 14px); }
/* leaving an easel: one plain way out, always in the same corner */
#btnLeave { position: absolute; right: clamp(14px, 3vw, 30px); bottom: var(--lb, 18px); padding: 7px 16px 7px 18px; border: 1px solid var(--line); border-radius: 999px; background: rgba(31, 34, 56, 0.3); font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.2em; opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0s linear 0.6s, border-color 0.4s, color 0.4s, box-shadow 0.4s; }
#btnLeave::after { content: "›"; margin-left: 8px; font-family: var(--font-latin); font-size: 17px; line-height: 0; }
.easel #btnLeave { opacity: 0.9; visibility: visible; transition: opacity 0.6s ease 0.8s, visibility 0s, border-color 0.4s, color 0.4s, box-shadow 0.4s; }
#btnLeave:hover { opacity: 1; border-color: var(--light); }
#btnLeave.go { border-color: var(--sun); color: var(--sun); box-shadow: 0 0 14px rgba(255, 198, 92, 0.45); animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateX(4px); } }
.coarse #btnLeave { padding: 11px 18px 11px 20px; font-size: 14px; }
.easel #flybtn { opacity: 0; pointer-events: none; }
/* a photograph of her own just taken can be passed on at once */
#btnShareNow { position: absolute; left: 50%; top: clamp(54px, 9vh, 78px); transform: translateX(-50%); padding: 8px 18px; border: 1px solid var(--sun); border-radius: 999px; background: rgba(31, 34, 56, 0.4); color: var(--sun); font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.2em; }
.coarse #btnShareNow { padding: 11px 20px; }
.framing #hint { bottom: auto; top: clamp(100px, 17vh, 132px); }
#sundial svg { width: 100%; height: 100%; overflow: visible; display: block; filter: drop-shadow(0 1px 2px rgba(31, 34, 56, 0.55)); }
#arc { fill: none; stroke: var(--line); stroke-width: 1.2; }
#horizon { stroke: var(--line); stroke-width: 1; }
#windows path { fill: none; stroke: var(--sun); stroke-width: 3.2; stroke-linecap: round; opacity: 0.55; }
#windows path.here { opacity: 1; stroke-width: 4; }
#sunHit { fill: transparent; cursor: ew-resize; }
#sunDot { fill: var(--sun); stroke: var(--light); stroke-width: 1.4; cursor: ew-resize; transition: opacity 0.6s; }
#sunDot.night { opacity: 0.25; }

#met { position: absolute; left: 50%; top: clamp(92px, 15vh, 130px); transform: translateX(-50%); width: max-content; max-width: 92vw; text-align: center; pointer-events: none; display: flex; align-items: baseline; gap: 14px; }
#met span { font-family: var(--font-meta); font-size: 12px; letter-spacing: 0.3em; color: var(--sun); }
#met b { font-weight: 600; font-size: clamp(17px, 2.2vw, 24px); letter-spacing: 0.16em; }
.easel #met, .framing #met { top: 10px; }
.metrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; margin-top: 16px; font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.12em; }
.metrow b { font-weight: 500; color: var(--sun); letter-spacing: 0.2em; margin-right: 6px; }
.metrow .mc { padding: 4px 12px; border: 1px dashed var(--line); border-radius: 999px; color: var(--mute); }
.metrow .mc.got { border-style: solid; border-color: rgba(255, 198, 92, 0.7); color: inherit; }
#hint { position: absolute; left: 50%; bottom: 116px; transform: translateX(-50%); width: max-content; max-width: min(92vw, 44em); text-align: center; font-family: var(--font-meta); font-size: 13.5px; letter-spacing: 0.14em; line-height: 1.8; pointer-events: none; }
#marker { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
#marker i { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border: 2px solid var(--sun); border-radius: 50%; background: rgba(31, 34, 56, 0.42); box-shadow: 0 0 12px rgba(255, 198, 92, 0.6); }
#marker i::before { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--sun); }
#marker i::after { content: ""; position: absolute; left: 50%; top: -13px; margin-left: -6px; border: 6px solid transparent; border-bottom-color: var(--sun); }
#marker.at i::after { display: none; }
#marker span { position: absolute; left: 0; top: 19px; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; border-radius: 999px; background: rgba(31, 34, 56, 0.62); font-family: var(--font-meta); font-size: 12px; letter-spacing: 0.06em; color: var(--sun); }
#marker.on { opacity: 1; }
#marker.at.on { opacity: 0.9; }
#marker.call i { animation: mkcall 1.2s ease-out infinite; }
@keyframes mkcall { 0% { box-shadow: 0 0 0 0 rgba(255, 198, 92, 0.85); } 100% { box-shadow: 0 0 0 20px rgba(255, 198, 92, 0); } }
/* (0.9) the beats the parasol has left: under the arc of the day, on a touch screen over the place where flying is held */
#beats { position: absolute; left: 50%; bottom: calc(clamp(8px, 2.4vh, 22px) + 15px); transform: translateX(-50%); display: flex; gap: 7px; pointer-events: none; } /* (inside the arc of the day, which is empty there) */
#beats i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--sun); background: rgba(31, 34, 56, 0.35); transition: background 0.25s ease; }
#beats i.full { background: var(--sun); box-shadow: 0 0 8px rgba(255, 198, 92, 0.6); }
#beats.dry { animation: beatsdry 0.42s ease; }
@keyframes beatsdry { 0%, 100% { margin-left: 0; } 25% { margin-left: -6px; } 75% { margin-left: 6px; } }
.coarse #beats { left: 78%; bottom: auto; top: calc(68% - 66px); }

/* at an easel: the picture's edge, drawn round as the light is caught */
#frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; box-shadow: 0 0 0 200vmax rgba(31, 34, 56, 0.34); }
#frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#frame rect { fill: none; }
#frEdge { stroke: var(--line); stroke-width: 1; }
#frInk { stroke: var(--sun); stroke-width: 2.5; }
#flash { position: absolute; inset: 0; background: var(--light); opacity: 0; pointer-events: none; }
#flash.go { animation: flash 1.1s ease-out; }
@keyframes flash { 0% { opacity: 0.55; } 100% { opacity: 0; } }
#thumbs { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; gap: 7px; pointer-events: none; }
.th { width: 42px; height: 28px; border: 1px solid var(--line); background: rgba(31, 34, 56, 0.2) center / cover no-repeat; position: relative; transition: border-color 0.4s, box-shadow 0.4s, transform 0.2s; cursor: default; }
#thumbs.on .th { pointer-events: auto; }
.th.got { cursor: pointer; }
.th.got:hover { transform: translateY(2px) scale(1.08); border-color: var(--light); }
/* until the first painting is caught the sun and the weather labels only show: they cannot be moved by a slip of the hand */
.sun-locked #sundial, .sun-locked #seasons { pointer-events: none !important; }
.th.no { animation: thNo 0.42s ease; }
@keyframes thNo { 0%, 100% { transform: none; } 22% { transform: translateX(-4px); } 66% { transform: translateX(4px); } }
.th.want { border-color: var(--light); box-shadow: 0 0 10px rgba(255, 250, 240, 0.6); }
.th.got { border: 2px solid var(--mat); box-shadow: 0 2px 8px rgba(31, 34, 56, 0.4); }
.th.now { border-color: var(--sun); box-shadow: 0 0 12px rgba(255, 198, 92, 0.7); }
.th i { position: absolute; left: 50%; bottom: -8px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; }
/* a painting just caught: its name stands on the picture for a few seconds in the letters of a place name, one size smaller,
   with its moment under it, low in the left corner so the picture stays open */
#capt { position: absolute; left: calc(var(--fx, 0px) + clamp(14px, calc(var(--fw, 0px) * 0.05), 48px)); bottom: calc(100% - var(--fy, 0px) - var(--fh, 0px) + clamp(12px, calc(var(--fh, 0px) * 0.07), 50px)); max-width: calc(var(--fw, 100vw) * 0.9); pointer-events: none; opacity: 0; transform: translateY(10px); transition: opacity 1.1s ease, transform 1.6s ease; }
#capt.on { opacity: 1; transform: none; }
#capt h3 { margin: 0; font-weight: 900; font-size: clamp(24px, 4.3vw, 58px); letter-spacing: 0.12em; line-height: 1.15; text-wrap: balance; }
.en #capt h3 { font-family: var(--font-latin); font-weight: 500; font-style: italic; letter-spacing: 0; }
#capt .w { margin-top: clamp(4px, 0.8vw, 10px); font-size: clamp(12.5px, 1.5vw, 18px); letter-spacing: 0.2em; opacity: 0.94; }
.en #capt .w { font-family: var(--font-latin); font-style: italic; letter-spacing: 0.02em; font-size: clamp(15px, 1.9vw, 23px); }

/* a small ring in the bottom left corner closes as the light of a painting comes round */
#orig { position: absolute; left: clamp(14px, 3vw, 30px); bottom: clamp(12px, 2.6vh, 24px); display: flex; align-items: center; pointer-events: none; }
#ogRing { width: 30px; height: 30px; flex: none; transform: rotate(-90deg); filter: drop-shadow(0 0 5px rgba(255, 198, 92, 0.4)); }
#ogRing .bg { fill: none; stroke: var(--line); stroke-width: 2.4; }
#ogRing .fg { fill: none; stroke: var(--sun); stroke-width: 3.6; stroke-linecap: round; transition: stroke-dasharray 0.25s linear; }
#ogRing .dot { fill: var(--sun); opacity: 0.9; transform-origin: 22px 22px; animation: breathe 1.6s ease-in-out infinite; }
#orig.done #ogRing .dot { animation: none; }
@keyframes breathe { 0%, 100% { transform: scale(0.7); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } }

/* the first minutes: one thing at a time is pointed out and named, beside the thing itself */
#coach { position: absolute; left: 0; top: 0; width: max-content; max-width: min(390px, calc(100vw - 24px)); padding: 12px 16px 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(31, 34, 56, 0.68); backdrop-filter: blur(6px); font-family: var(--font-meta); z-index: 3; }
#coach p { margin: 0; font-size: 13.5px; line-height: 1.75; letter-spacing: 0.06em; }
#coach .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 8px; font-size: 12.5px; letter-spacing: 0.1em; color: var(--mute); }
#coach .keys:empty { display: none; }
.kc { display: inline-flex; align-items: center; gap: 4px; }
.kc i { font-style: normal; margin-left: 4px; }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border: 1px solid var(--light); border-bottom-width: 2px; border-radius: 6px; font: 500 12px/1 var(--font-meta); letter-spacing: 0.04em; color: var(--light); background: rgba(255, 250, 240, 0.08); }
#coHalo { position: absolute; left: 0; top: 0; border: 1.5px solid var(--sun); border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
#coHalo.on { opacity: 1; animation: halo 1.8s ease-in-out infinite; }
@keyframes halo { 0%, 100% { box-shadow: 0 0 8px rgba(255, 198, 92, 0.35), inset 0 0 6px rgba(255, 198, 92, 0.15); } 50% { box-shadow: 0 0 20px rgba(255, 198, 92, 0.75), inset 0 0 12px rgba(255, 198, 92, 0.3); } }

/* the guide: every key and every sign on the screen, to be opened at any time */
#help { position: absolute; inset: 0; z-index: 4; background: rgba(31, 34, 56, 0.82); backdrop-filter: blur(14px) saturate(1.1); overflow-y: auto; padding: clamp(18px, 4vw, 52px) clamp(16px, 5vw, 72px) 48px; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s linear 0.5s; touch-action: pan-y; }
#help.on { opacity: 1; visibility: visible; transition: opacity 0.5s ease, visibility 0s; }
#help h3 { margin: 0; font-size: 24px; letter-spacing: 0.4em; font-weight: 600; }
.en #help h3 { font-family: var(--font-latin); font-style: italic; letter-spacing: 0.04em; font-size: 30px; font-weight: 500; }
#help .x { font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.2em; }
#hpBody { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(22px, 4vw, 60px); max-width: 1120px; }
#hpBody h4 { margin: 0 0 6px; padding-bottom: 9px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; letter-spacing: 0.3em; }
.en #hpBody h4 { font-family: var(--font-latin); font-style: italic; font-size: 21px; font-weight: 500; letter-spacing: 0.02em; }
.lg { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 9px 0; font-family: var(--font-meta); font-size: 13.5px; line-height: 1.7; letter-spacing: 0.05em; color: var(--mute); }
.lg .ic { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 34px; }
.lg .ic svg { width: 64px; height: 34px; overflow: visible; display: block; }
.lg b { display: block; font-weight: 500; color: var(--light); letter-spacing: 0.1em; }

/* arriving somewhere: a name and its years, then nothing */
#card { display: flex; flex-direction: column; justify-content: center; padding: clamp(22px, 8vw, 110px); gap: 6px; background: linear-gradient(100deg, rgba(31, 34, 56, 0.58), rgba(31, 34, 56, 0.3) 44%, rgba(31, 34, 56, 0) 72%); } /* (a veil on the side of the words: by day the land behind them is bright) */
#card h2 { margin: 0; font-size: clamp(38px, 6.6vw, 88px); font-weight: 900; letter-spacing: 0.12em; line-height: 1.1; }
.en #card h2 { font-family: var(--font-latin); font-weight: 500; font-style: italic; letter-spacing: 0; text-wrap: balance; }
#card .yrs { font-family: var(--font-latin); font-style: italic; font-size: clamp(22px, 3vw, 34px); font-variant-numeric: tabular-nums; opacity: 0.9; }
#card .wl { display: flex; flex-wrap: wrap; gap: clamp(7px, 1vw, 12px); margin-top: clamp(14px, 2vw, 24px); }
#card .wl i { width: clamp(30px, 3.6vw, 46px); aspect-ratio: 3 / 2; border: 1px solid rgba(255, 250, 240, 0.7); border-radius: 2px; background: rgba(255, 250, 240, 0.05) center / cover no-repeat; box-shadow: 0 2px 10px rgba(8, 10, 24, 0.35); }
#card .wl i.on { border-color: var(--sun); }
#card .gl { margin: clamp(12px, 1.8vw, 22px) 0 0; max-width: 31em; font-family: var(--font-meta); font-size: clamp(14px, 1.5vw, 17px); line-height: 1.75; letter-spacing: 0.08em; opacity: 0.94; }
/* the ending: the world goes on turning behind a wall of her own pictures, and a few lines are said one after another */
#finale { position: absolute; inset: 0; z-index: 6; overflow-y: auto; display: flex; padding: clamp(16px, 4vw, 44px); background: radial-gradient(ellipse at 50% 42%, rgba(31, 34, 56, 0.58), rgba(18, 20, 38, 0.86)); opacity: 0; visibility: hidden; transition: opacity 2.6s ease, visibility 0s linear 2.6s; touch-action: pan-y; }
#finale.on { opacity: 1; visibility: visible; transition: opacity 2.6s ease, visibility 0s; }
.fin { margin: auto; width: min(100%, 1060px); display: flex; flex-direction: column; align-items: center; gap: clamp(9px, 2vh, 20px); text-align: center; }
.fin p, .fin .acts { margin: 0; opacity: 0; transform: translateY(8px); transition: opacity 1.8s ease, transform 2.4s ease; text-wrap: balance; }
.fin p.on, .fin .acts.on { opacity: 1; transform: none; }
.fin .fa { font-family: var(--font-meta); font-size: clamp(12.5px, 1.4vw, 15.5px); letter-spacing: 0.2em; line-height: 1.8; color: var(--mute); }
.fin .fb { font-size: clamp(16px, 2.1vw, 23px); letter-spacing: 0.1em; line-height: 1.7; }
.fin .fb small { display: block; font-family: var(--font-meta); font-size: 0.62em; letter-spacing: 0.16em; color: var(--mute); margin-top: 4px; }
.fin .fc { font-size: clamp(21px, 3.3vw, 40px); font-weight: 900; letter-spacing: 0.1em; line-height: 1.5; margin: clamp(2px, 1vh, 10px) 0; }
.en .fin .fb, .en .fin .fc { font-family: var(--font-latin); font-style: italic; font-weight: 500; letter-spacing: 0.01em; }
.en .fin .fc { font-size: clamp(25px, 3.9vw, 48px); line-height: 1.2; }
.fin .fd { font-family: var(--font-meta); font-size: 13px; line-height: 1.9; letter-spacing: 0.08em; color: var(--mute); max-width: 44em; }
.fin .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 4px; }
.fin .acts .plaque { font-size: 15px; padding: 10px 22px 10px 24px; }
.wall { --wc: 9; --wg: clamp(4px, 0.8vw, 9px); display: flex; flex-wrap: wrap; justify-content: center; gap: var(--wg); width: 100%; }
.wall i { width: calc((100% - (var(--wc) - 1) * var(--wg)) / var(--wc) - 0.1px); aspect-ratio: 3 / 2; background: var(--mat) center / cover no-repeat; border: 2px solid var(--mat); box-shadow: 0 4px 14px rgba(8, 10, 24, 0.5); opacity: 0; transform: scale(0.5) rotate(var(--r, 0deg)); transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.2, 1.5, 0.4, 1); }
.wall i.on { opacity: 1; transform: rotate(var(--r, 0deg)); }
#fnImg { display: block; max-width: min(100%, 420px); margin: 6px auto 0; box-shadow: 0 10px 34px rgba(8, 10, 24, 0.6); }
#fnImg[hidden] { display: none; }
#fnTip { font-family: var(--font-meta); font-size: 12px; letter-spacing: 0.12em; color: var(--mute); }
@media (max-width: 700px) { .wall { --wc: 5; } }

/* the album: the day goes dim behind it and the pictures hang in their mounts */
#album { position: absolute; inset: 0; background: rgba(31, 34, 56, 0.74); backdrop-filter: blur(14px) saturate(1.1); overflow-y: auto; padding: clamp(18px, 4vw, 52px) clamp(16px, 5vw, 72px) 60px; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s linear 0.5s; touch-action: pan-y; }
#album.on { opacity: 1; visibility: visible; transition: opacity 0.5s ease, visibility 0s; }
#album header, #help header { display: flex; justify-content: flex-start; align-items: baseline; gap: clamp(14px, 3vw, 30px); margin-bottom: clamp(14px, 3vw, 30px); }
#album .x, #help .x, #detail .bar #dtBack { display: inline-flex; align-items: baseline; gap: 8px; color: var(--light); opacity: 0.9; padding: 10px 14px 10px 0; }
#album .x::before, #help .x::before, #detail .bar #dtBack::before { content: "‹"; font-family: var(--font-latin); font-size: 22px; line-height: 0; }
#album .x:hover, #help .x:hover, #detail .bar #dtBack:hover { opacity: 1; color: var(--sun); }
#album h3 { margin: 0; font-size: 24px; letter-spacing: 0.4em; font-weight: 600; }
.en #album h3 { font-family: var(--font-latin); font-style: italic; letter-spacing: 0.04em; font-size: 30px; font-weight: 500; }
#album .x { font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.2em; }
#album .show { margin-left: auto; font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.2em; padding: 7px 16px; border: 1px solid var(--sun); border-radius: 999px; color: var(--sun); }
#album .show:hover { background: var(--sun); color: var(--dusk); }
#album .show[hidden] { display: none; }
.pic.hid .im { position: relative; }
.pic.hid.none .im { border-color: rgba(255, 198, 92, 0.55); display: flex; align-items: center; justify-content: center; font-family: var(--font-latin); font-style: italic; font-size: 30px; color: rgba(255, 198, 92, 0.7); }
.pic.hid figcaption small b { font-weight: 500; color: var(--sun); margin-right: 8px; letter-spacing: 0.2em; }
.wsec { margin-bottom: clamp(26px, 4vw, 46px); }
.wsec .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding-bottom: 10px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.wsec .head b { font-size: 20px; font-weight: 600; letter-spacing: 0.14em; }
.en .wsec .head b { font-family: var(--font-latin); font-style: italic; letter-spacing: 0.01em; font-size: 25px; font-weight: 500; }
.wsec .head i { font-family: var(--font-latin); font-size: 18px; color: var(--mute); font-variant-numeric: tabular-nums; }
.wsec .head span { font-family: var(--font-meta); font-size: 12px; letter-spacing: 0.16em; color: var(--mute); }
.wsec .head button { margin-left: auto; font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.2em; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; }
.wsec .head button:hover { background: var(--light); color: var(--dusk); }
.wsec.locked { opacity: 0.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px 16px; }
.pic { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.pic .im { aspect-ratio: 3 / 2; background: var(--mat) center / cover no-repeat; border: 7px solid var(--mat); box-shadow: 0 6px 22px rgba(10, 12, 28, 0.45); }
.pic.none .im { background: none; border: 1px dashed var(--line); box-shadow: none; }
.pic figcaption { font-size: 14.5px; line-height: 1.5; letter-spacing: 0.04em; }
.en .pic figcaption { font-family: var(--font-latin); font-style: italic; font-size: 17px; letter-spacing: 0; }
.pic figcaption small { display: block; font-family: var(--font-meta); font-style: normal; font-size: 11.5px; letter-spacing: 0.08em; color: var(--mute); margin-top: 2px; }
.pic.got { cursor: pointer; }
.pic.got .im { transition: transform 0.25s ease, box-shadow 0.25s ease; }
.pic.got:hover .im, .pic.got:focus-visible .im { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(10, 12, 28, 0.55); }
.credit { margin: 18px 0 0; font-family: var(--font-meta); font-size: 11.5px; letter-spacing: 0.06em; line-height: 1.7; color: var(--mute); }
/* one painting taken down from the wall: hers beside his, and a few words */
#detail { position: fixed; inset: 0; z-index: 5; overflow-y: auto; padding: clamp(16px, 3.4vw, 44px) clamp(16px, 5vw, 72px) 48px; background: rgba(24, 26, 44, 0.97); opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s linear 0.4s; touch-action: pan-y; }
#detail.on { opacity: 1; visibility: visible; transition: opacity 0.4s ease, visibility 0s; }
#detail .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: clamp(12px, 2.4vw, 26px); font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.2em; color: var(--mute); }
#detail .bar button { padding: 8px 6px; }
#detail .bar button:hover { color: var(--light); }
#detail .bar .nav { display: flex; gap: 6px; }
#detail .bar .nav button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; }
#detail .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(14px, 3vw, 40px); align-items: end; max-width: 1180px; margin: 0 auto; }
#detail figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
#detail figure img { display: block; max-width: 100%; max-height: min(52vh, 520px); width: auto; height: auto; background: var(--mat); border: clamp(6px, 1vw, 12px) solid var(--mat); box-shadow: 0 10px 34px rgba(8, 10, 24, 0.6); }
#detail figure.gone img { display: none; }
#detail.solo .his { display: none; }
#detail.solo .pair { grid-template-columns: minmax(0, 1fr); }
#detail figcaption { font-family: var(--font-meta); font-size: 12px; letter-spacing: 0.3em; color: var(--mute); }
#detail figure.his figcaption { color: var(--sun); }
#detail .txt { max-width: 46em; margin: clamp(18px, 3vw, 34px) auto 0; }
#detail h4 { margin: 0; font-size: clamp(24px, 3vw, 36px); font-weight: 900; letter-spacing: 0.1em; line-height: 1.25; }
.en #detail h4 { font-family: var(--font-latin); font-style: italic; font-weight: 500; letter-spacing: 0; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.1; text-wrap: balance; }
#detail .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: var(--font-meta); font-size: 13px; letter-spacing: 0.08em; color: var(--mute); }
#detail .meta .w { color: var(--sun); }
#detail p { margin: 16px 0 0; font-size: 16.5px; line-height: 2; letter-spacing: 0.04em; color: var(--light); }
.en #detail p { font-family: var(--font-latin); font-size: 21px; line-height: 1.5; letter-spacing: 0; }
@media (max-width: 720px) { #detail .pair { grid-template-columns: 1fr; } #detail figure img { max-height: 38vh; } }
#dtCap { display: block; width: 100%; max-width: 46em; margin-top: 22px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 250, 240, 0.04); color: var(--light); font: inherit; font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif; font-size: 15px; line-height: 1.65; letter-spacing: 0.01em; resize: vertical; }
.coarse #dtCap { font-size: 16px; }
#dtCap:focus { outline: none; border-color: var(--sun); }
#detail .acts { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-family: var(--font-meta); font-size: 12.5px; letter-spacing: 0.16em; color: var(--mute); }
#detail .acts button { padding: 9px 20px; border: 1px solid var(--line); border-radius: 999px; color: var(--light); }
#detail .acts button:hover { background: var(--light); color: var(--dusk); }
#detail .acts button.quiet { border-color: transparent; color: var(--mute); padding: 9px 6px; }
#detail .acts #dtX, #detail .acts #dtIG { border-color: var(--sun); color: var(--sun); }
#detail .acts #dtX:hover, #detail .acts #dtIG:hover { background: var(--sun); color: var(--dusk); }
#dtTip a { color: var(--sun); }
#shareImg { display: block; max-width: min(100%, 760px); margin: 18px auto 0; box-shadow: 0 10px 34px rgba(8, 10, 24, 0.6); }
#shareImg[hidden] { display: none; }
.set { display: grid; grid-template-columns: 5.5em minmax(0, 320px); align-items: center; gap: 14px; font-family: var(--font-meta); font-size: 13.5px; letter-spacing: 0.12em; padding-top: 22px; border-top: 1px solid var(--line); }
.seg { display: flex; }
.seg button { flex: 1; padding: 8px 6px; border: 1px solid var(--line); margin-left: -1px; font-size: 13px; letter-spacing: 0.12em; }
.seg button.active { background: var(--light); color: var(--dusk); border-color: var(--light); }
input[type="range"] { width: 100%; accent-color: var(--sun); }
.set .restart { grid-column: 1 / -1; justify-self: start; color: var(--mute); border-bottom: 1px solid var(--line); padding: 4px 0; letter-spacing: 0.16em; }

/* touch */
#touch { position: absolute; inset: 0; pointer-events: none; display: none; }
.coarse #touch { display: block; }
#stick { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border: 1px solid var(--line); border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
#stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255, 250, 240, 0.5); }
/* the parasol on a phone: no button. A ring comes up under the thumb wherever it rests in the lower right of the screen */
#flybtn { position: absolute; left: 78%; top: 68%; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; border: 1.5px solid var(--light); background: rgba(255, 250, 240, 0.1); pointer-events: none; opacity: 0; transition: opacity 0.16s ease, background 0.16s ease, transform 0.16s ease; }
#flybtn.near { opacity: 0.5; }
#flybtn.held { opacity: 1; background: rgba(255, 250, 240, 0.32); transform: scale(1.08); }
#flybtn.ghost { opacity: 0.6; border-style: dashed; animation: flyGhost 1.7s ease-in-out infinite; }
@keyframes flyGhost { 50% { transform: scale(1.14); opacity: 0.28; } }

.coarse #hint, .coarse #caught { max-width: calc(100vw - 32px); }
.coarse .th { width: 56px; height: 38px; }
.coarse #coach { pointer-events: none; }
.lay-tall #thumbs { top: 58px; gap: 8px; }
.lay-tall #gain { top: 116px; right: 16px; } /* on an upright phone the row of frames stands under the small pictures of the easel, not beside them */
.lay-tall #soundHint.play { top: 108px; left: 14px; }
.lay-tall #orig { left: 18px; bottom: 26px; }
.lay-tall #shutter { top: auto; margin-top: 0; right: 22px; bottom: calc(var(--cb, 64px) + 138px); }
.lay-low #shutter { right: auto; left: calc(var(--bs, 180px) / 2 - 31px); }
.coarse.framing #flybtn { opacity: 0; pointer-events: none; }
@media (max-width: 640px) {
  .lg { grid-template-columns: 104px minmax(0, 1fr); }
  #detail p { font-size: 15.5px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .fade, #album, #detail, #help, #capt, #finale, .fin p, .fin .acts, .wall i { transition-duration: 0.01s; }
  #ogRing .dot, #coHalo.on, #soundHint.on, #marker.call i, #tools #btnSeek.call { animation: none; }
  #flash.go { animation: none; }
}
</style>

<body>
<div id="app">
  <canvas id="view" aria-label="A painted world you can walk through"></canvas>

  <div id="paint" class="layer">
    <div id="frame"><svg><rect id="frEdge" x="0" y="0" width="100%" height="100%"></rect><rect id="frInk" x="0" y="0" width="100%" height="100%" pathLength="100" stroke-dasharray="0 100"></rect></svg>
</div>
    <div id="print"><img id="prImg" alt=""></div>
    <div id="capt" class="shade" aria-live="polite"><h3 id="cpT"></h3><div class="w" id="cpW"></div></div>
    <div id="flash"></div>
  </div>

  <div id="hud" class="layer fade">
    <div id="tools" class="shade">
      <button id="btnFree" type="button"></button>
      <button id="btnSeek" type="button"></button>
      <button id="btnAlbum" type="button"><span id="albLabel"></span><span class="n" id="albCount"></span></button>
      <button id="btnHelp" type="button"></button>
    </div>
    <div id="thumbs" class="fade"></div>
    <div id="marker"><i></i><span id="mkDist"></span></div>
    <div id="beats" class="fade"></div>
    <div id="hint" class="shade fade"></div>
    <div id="met" class="shade fade"><span id="metK"></span><b id="metN"></b></div>
    <div id="orig" class="shade fade">
      <svg id="ogRing" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="18"></circle><circle class="fg" id="ogArc" cx="22" cy="22" r="18" pathLength="100" stroke-dasharray="0 100"></circle><circle class="dot" cx="22" cy="22" r="4.5"></circle></svg>
    </div>
    <div id="coHalo"></div>
    <div id="coach" class="shade fade" role="status" aria-live="polite"><div class="keys" id="coKeys"></div><p id="coText"></p></div>
    <div id="gain" class="shade fade"></div>
    <button id="shutter" type="button" aria-label="Keep this view"></button>
    <div id="clock" class="shade">
      <div id="sundial" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <svg viewBox="0 0 264 78">
          <line id="horizon" x1="6" y1="66" x2="258" y2="66"></line>
          <path id="arc" d="M 16 66 A 116 52 0 0 1 248 66"></path>
          <g id="windows"></g>
          <path id="sunHit" d="M 0 0 H 264 V 78 H 0 Z"></path>
          <circle id="sunDot" r="7.5" cx="132" cy="14"></circle>
        </svg>
      </div>
      <div id="seasons" role="group" aria-label="Season"></div>
    </div>
    <button id="btnLeave" class="shade" type="button"></button>
    <button id="btnShareNow" class="shade fade" type="button"></button>
    <div id="touch"><div id="stick"><i></i></div><div id="flybtn"></div></div>
  </div>

  <div id="card" class="layer fade shade"><h2 id="cdName"></h2><div class="yrs" id="cdYrs"></div><div class="wl" id="cdWall"></div><p class="gl" id="cdGoal"></p></div>

  <div id="title" class="layer fade shade">

    <div class="acts"><button class="plaque" id="btnStart" type="button"></button><button class="plaque quiet" id="btnFresh" type="button" hidden></button></div>

  <button class="lang shade" id="btnLang" type="button" aria-label="Language"></button>
  <div id="soundHint" class="fade shade" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.6v4.8h3.4L12 18V6L7.4 9.6H4z"/><path d="M15.4 9a4.3 4.3 0 0 1 0 6M17.9 6.6a7.7 7.7 0 0 1 0 10.8" fill="none"/></svg><span id="soundTxt"></span></div>

  <section id="album" aria-hidden="true">

    <div id="alBody"></div>
    <p class="credit" id="alCredit"></p>
    <div class="set">

      <label id="sL" for="l-zh"></label><div class="seg" id="segL"><button type="button" id="l-zh" data-l="zh">中文</button><button type="button" id="l-en" data-l="en">English</button></div>
      <button class="restart" id="btnRestart" type="button"></button>
    </div>
  </section>

  <section id="finale" aria-hidden="true">
    <div class="fin shade">
      <p class="fa" id="fnA"></p>
      <div class="wall" id="fnWall"></div>
      <p class="fb" id="fnB"></p>
      <p class="fc" id="fnC"></p>
      <p class="fd" id="fnD"></p>
      <div class="acts" id="fnActs"><button class="plaque" id="fnShare" type="button"></button><button class="plaque quiet" id="fnBack" type="button"></button></div>
      <img id="fnImg" alt="" hidden><span id="fnTip"></span>
    </div>
  </section>

  <section id="help" aria-hidden="true">
    <header><button class="x" id="hpClose" type="button"></button><h3 id="hpTitle"></h3></header>
    <div id="hpBody"></div>
  </section>

  <section id="detail" aria-hidden="true">
    <div class="bar"><button id="dtBack" type="button"></button><div class="nav"><button id="dtPrev" type="button"></button><button id="dtNext" type="button"></button></div></div>
    <div class="pair">
      <figure class="mine"><img id="dtMine" alt=""><figcaption id="dtMineL"></figcaption></figure>
      <figure class="his" id="dtHisBox"><img id="dtHis" alt=""><figcaption id="dtHisL"></figcaption></figure>
    </div>
    <div class="txt"><h4 id="dtT"></h4><div class="meta"><span id="dtY"></span><span class="w" id="dtW"></span><span id="dtA"></span></div><p id="dtN"></p>
      <textarea id="dtCap" rows="3" spellcheck="false" aria-label="caption"></textarea>
      <div class="acts"><button id="dtX" type="button"></button><button id="dtIG" type="button"></button><button id="dtSave" type="button"></button><button id="dtDel" class="quiet" type="button"></button><span id="dtTip"></span></div>
      <img id="shareImg" alt="" hidden></div>
  </section>

  <div id="loading"></div>
</div>
